[tool.poetry]
name = "diary-messaging"
version = "0.1.0"
description = "Kafka event envelope and adapters shared by Diary services"
authors = ["Diary API Team"]
readme = "README.md"
packages = [{ include = "diary_messaging", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
pydantic = "^2.14.1"
aiokafka = "^0.12.0"
diary-observability = { path = "../observability", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
