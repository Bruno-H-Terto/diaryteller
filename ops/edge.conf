# Example edge server. TLS terminates here; internal routes are never exposed.
server {
    listen 443 ssl;
    server_name api.example.invalid;
    ssl_certificate /etc/letsencrypt/live/api.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.invalid/privkey.pem;
    client_max_body_size 12m;

    location / {
        # Remove caller-supplied internal identity headers before proxying.
        proxy_set_header X-Internal-Service "";
        proxy_set_header X-Internal-Token "";
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://conversation:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Connection "";
    }

    location /v1/auth/ { proxy_pass http://identity:8000; }
    location /v1/me/ { proxy_pass http://identity:8000; }
    location /v1/operations/ { proxy_pass http://identity:8000; }
    location /v1/billing/ { proxy_pass http://identity:8000; }
    location /v1/speech/ { proxy_pass http://speech:8000; }

    location /internal/ { return 404; }
    location /mcp { return 404; }
    location /metrics { return 404; }
}
