[tool.poetry]
name = "diary-api-workspace"
version = "0.1.0"
description = "Development workspace for the local-first personal diary backend"
authors = ["Diary API Team"]
readme = "README.md"
packages = [
  { include = "diary_contracts", from = "packages/contracts/src" },
  { include = "diary_observability", from = "packages/observability/src" },
  { include = "diary_security", from = "packages/security/src" },
  { include = "identity", from = "services/identity/src" },
  { include = "conversation", from = "services/conversation/src" },
  { include = "speech", from = "services/speech/src" },
  { include = "memory_mcp", from = "services/memory_mcp/src" },
  { include = "notifications", from = "services/notifications/src" },
  { include = "maintenance", from = "jobs/src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = "^0.146.0"
uvicorn = { version = "^0.54.0", extras = ["standard"] }
pydantic = "^2.14.1"
pydantic-settings = "^2.16.0"
email-validator = "^2.3.0"
sqlalchemy = { version = "^2.1.5", extras = ["asyncio"] }
asyncpg = "^0.32.0"
alembic = "^1.20.0"
pyjwt = { version = "^2.15.1", extras = ["crypto"] }
joserfc = "^1.7.7"
argon2-cffi = "^25.1.0"
pymongo = "^4.19.0"
mcp = "^2.3.0"
openai = "^3.35.1"
httpx = "^0.28.1"
aiosmtplib = "^5.1.3"
cryptography = "^50.0.2"
google-auth = "^2.62.0"
requests = "^2.32.5"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
ruff = "^0.17.1"
black = "^26.10.1"
pyright = "^1.1.414"
memray = "^1.20.0"
anyio = "^4.13.0"
psutil = "^7.1.0"
openapi-spec-validator = "^0.9.0"
jsonschema = "^4.26.0"

[tool.poetry.scripts]
diary-maintenance = "maintenance.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["ops", "**/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations/versions"

[tool.pyright]
include = ["packages", "services", "jobs", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
exclude = ["**/migrations/versions", "**/.venv"]
reportMissingTypeStubs = false
reportUnnecessaryComparison = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["packages", "services", "jobs", "tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires PostgreSQL and MongoDB containers",
  "contract: validates exported OpenAPI and Android contract compatibility",
  "e2e: requires the full local stack or in-process services",
  "slow: long-running performance scenario",
]
filterwarnings = ["ignore::DeprecationWarning"]
