[tool.poetry]
name = "maintenance"
version = "0.1.0"
description = "Diary API maintenance jobs"
authors = ["Diary API Team"]
readme = "README.md"
packages = [{ include = "maintenance", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
pydantic = "^2.14.1"
pydantic-settings = "^2.16.0"
sqlalchemy = { version = "^2.1.5", extras = ["asyncio"] }
asyncpg = "^0.32.0"
pymongo = "^4.19.0"
google-auth = "^2.62.0"
requests = "^2.32.5"
cryptography = "^50.0.2"
diary-contracts = { path = "../../packages/contracts", develop = true }
diary-observability = { path = "../../packages/observability", develop = true }
diary-security = { path = "../../packages/security", develop = true }
identity = { path = "../../api", develop = true }

[tool.poetry.scripts]
diary-maintenance = "maintenance.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
