[tool.poetry]
name = "exchange"
version = "0.1.0"
description = "Diary API exchange service"
authors = ["Diary API Team"]
readme = "README.md"
packages = [{ include = "exchange", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = "^0.146.0"
uvicorn = { version = "^0.54.0", extras = ["standard"] }
pydantic = "^2.14.1"
pydantic-settings = "^2.16.0"
httpx = "^0.28.1"
sqlalchemy = { version = "^2.1.5", extras = ["asyncio"] }
asyncpg = "^0.32.0"
alembic = "^1.20.0"
boto3 = "^1.40.0"
cryptography = "^50.0.2"
diary-contracts = { path = "../../packages/contracts", develop = true }
diary-observability = { path = "../../packages/observability", develop = true }
diary-security = { path = "../../packages/security", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
